<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Source Sans 3 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Source Sans 3', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-lg text-gray-800">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-xl text-center">
        <!-- Logo -->
        <img src="KM.png" alt="Logo" class="mx-auto h-32 w-auto mb-6">

        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-red-100 mb-6">
            <i class="ph-bold ph-x text-4xl text-red-600"></i>
        </div>

        <p class="text-gray-600 mb-8 text-lg leading-relaxed">You have cancelled the transaction. No charges were made to your card.</p>
        
        <!-- Return Button -->
        <a href="https://raindropdallas.org" class="inline-block w-full bg-gray-600 text-white font-bold text-lg py-4 px-6 rounded-full hover:bg-gray-700 transition-colors shadow-md">
            Return to Home

    </div>
