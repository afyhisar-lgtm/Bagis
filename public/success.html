<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Source Sans 3', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-lg text-gray-800">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-xl text-center">
        <!-- Logo -->
        <img src="KM.png" alt="Logo" class="mx-auto h-32 w-auto mb-6">
        
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-green-100 mb-6">
            <i class="ph-bold ph-check text-4xl text-green-600"></i>
        </div>
        <h2 class="text-4xl font-bold text-gray-900 mb-3">Thank You!</h2>
        <p class="text-gray-600 mb-8 text-lg">Your contribution has been received successfully. A receipt has been sent to your email.</p>
        
        <!-- Transaction Details -->
        <div id="details-container" class="bg-[#3282CE]/5 border border-[#3282CE]/20 rounded-xl p-6 mb-8 text-base text-gray-700 opacity-50 animate-pulse">
            
            <div class="text-center mb-4">
                <p class="text-sm text-gray-500 uppercase tracking-wide font-semibold">Total Donated</p>
                <p class="text-3xl font-bold text-[#3282CE]">
                    <span id="display-amount">Loading...</span> <span id="display-type" class="text-lg font-normal text-gray-600"></span>
                </p>
            </div>

            <!-- Breakdown -->
            <div class="pt-4 border-t border-[#3282CE]/10 text-center">
                <p class="text-lg text-gray-600">
                    (<span id="display-net" class="font-semibold text-gray-800">...</span> for Raindrop Dallas + <span id="display-fee" class="font-semibold text-gray-800">...</span> bank fees)
                </p>
            </div>
        </div>

        <!-- Primary Action: Return to Home -->
        <div class="space-y-4">
            <a href="https://raindropdallas.org" class="inline-block w-full bg-[#3282CE] text-white font-bold text-lg py-4 px-6 rounded-full hover:bg-[#2868a5] transition-colors shadow-md">
                Return to Home
            </a>
        </div>

        <!-- Secondary Link: Customer Portal (Hidden by default, shown only for Monthly) -->
        <div id="portal-container" class="mt-8 hidden">
            <a id="portal-link" href="#" class="text-base text-gray-500 hover:text-[#3282CE] transition-colors underline decoration-2 decoration-gray-300 hover:decoration-[#3282CE]">
                Manage Donations (Customer Portal)
            </a>
        </div>
    </div>

    <script>
        // Fetch Config for Portal Link
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                if (response.ok) {
                    const config = await response.json();
                    const portalLinkEl = document.getElementById('portal-link');
                    if (config.customer_portal_link) {
                        portalLinkEl.href = config.customer_portal_link;
                    }
                }
            } catch (err) {
                console.log("Backend not detected, using default configuration.");
                const defaultConfig = {
                    customer_portal_link: "https://billing.stripe.com/p/login/test_28E6oI3tO1h76Ku71cd3i00"
                };
                const portalLinkEl = document.getElementById('portal-link');
                if (defaultConfig.customer_portal_link) {
                    portalLinkEl.href = defaultConfig.customer_portal_link;
                }
            }
        }

        // Verify Payment with Stripe via Backend
        async function verifyPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');

            if (!sessionId) {
                // Mock data for preview
                const container = document.getElementById('details-container');
                container.classList.remove('opacity-50', 'animate-pulse');
                document.getElementById('display-amount').textContent = '$0.00';
                document.getElementById('display-net').textContent = '$0.00';
                document.getElementById('display-fee').textContent = '$0.00';
                document.getElementById('display-type').textContent = '';
                return;
            }

            try {
                // Call the updated backend endpoint that verifies exact fees from Stripe
                const response = await fetch(`/api/checkout-session?sessionId=${sessionId}`);
                if (response.ok) {
                    const data = await response.json();
                    
                    // Stop loading animation
                    const container = document.getElementById('details-container');
                    container.classList.remove('opacity-50', 'animate-pulse');

                    // Update UI with verified data
                    document.getElementById('display-amount').textContent = '$' + data.amount;
                    document.getElementById('display-net').textContent = '$' + data.net;
                    document.getElementById('display-fee').textContent = '$' + data.fee;
                    
                    // Handle Payment Type Display
                    const displayTypeText = data.type === 'Monthly' ? 'Monthly' : 'One Time';
                    document.getElementById('display-type').textContent = displayTypeText;

                    // Show Customer Portal link ONLY if payment type is Monthly
                    if (data.type === 'Monthly') {
                        document.getElementById('portal-container').classList.remove('hidden');
                    }

                } else {
                    console.error("Verification failed");
                    document.getElementById('display-amount').textContent = 'Error';
                }
            } catch (err) {
                console.error("Network error verifying payment", err);
            }
        }

        // Init
        loadConfig();
        verifyPayment();
    </script>
</body>
</html>
